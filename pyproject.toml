[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openrouter-studio"
version = "2.1.0"
description = "A local, AI-Studio-style web UI, CLI, and Python library for OpenRouter models."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abolfazl" }]
keywords = ["openrouter", "llm", "ai", "chat", "cli", "web"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
]
dependencies = ["requests>=2.31"]

[project.scripts]
openrouter-studio = "openrouter_studio.server:main"
openrouter = "openrouter_studio.cli:main"

[tool.setuptools]
packages = ["openrouter_studio"]
py-modules = ["openrouter_client"]  # old import name, kept working
include-package-data = false

[tool.setuptools.package-data]
openrouter_studio = ["web/*"]
